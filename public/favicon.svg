<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Telegraph Ghost: the amber LCD, cracked, with a dit-dah and two eyes in the black -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc23a" />
      <stop offset="1" stop-color="#c77800" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#0b0b0c" />
  <rect x="6" y="14" width="52" height="36" rx="4" fill="#1d1d20" />
  <rect x="9" y="17" width="46" height="30" rx="2" fill="url(#g)" />
  <!-- the dit and the dah -->
  <circle cx="20" cy="24.5" r="2.6" fill="#3a2200" />
  <rect x="26" y="22" width="14" height="5" rx="2.5" fill="#3a2200" />
  <!-- the black bleeding in from a crack -->
  <path d="M46 17 L41 28 L47 33 L43 47 L55 47 L55 17 Z" fill="#050505" />
  <path d="M41 28 L33 31 M47 33 L37 41" stroke="#050505" stroke-width="1.4" stroke-linecap="round" />
  <!-- and something looking out of it -->
  <circle cx="47.5" cy="26" r="1.3" fill="#f6f1e6" />
  <circle cx="52" cy="25.2" r="1.1" fill="#f6f1e6" />
</svg>
