name: Deploy to GitHub Pages

# The live demo judges open on their phones: every push to main is built and
# published at https://einsajo.github.io/<repository name>/ (the base path follows the repo's name)
# (no agent route here: the radio's agents run on their built-in local brains)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b && npx vite build --base=/${{ github.event.repository.name }}/
      # every public asset must carry the sub-path, or the font and icon 404 on Pages
      - run: |
          grep -q '/${{ github.event.repository.name }}/favicon.svg' dist/index.html
          grep -q '/${{ github.event.repository.name }}/fonts/VT323-Regular.ttf' dist/index.html
          grep -rq '/${{ github.event.repository.name }}/fonts/VT323-Regular.ttf' dist/assets/*.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
