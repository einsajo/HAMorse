name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # type-check (tsc -b) and production build
      - run: npm run build
      # unit tests: Morse timing and decoding, stations, agents, the agent route, the live-streams power
      - run: npm test
      # the same build at the Pages sub-path: every public asset must carry it
      - run: |
          npx vite build --base=/ghostFrequency-/ --outDir dist-pages
          grep -q '/ghostFrequency-/favicon.svg' dist-pages/index.html
          grep -q '/ghostFrequency-/fonts/VT323-Regular.ttf' dist-pages/index.html
          grep -rq '/ghostFrequency-/fonts/VT323-Regular.ttf' dist-pages/assets/*.css
      # every A-Z / 0-9 code against ITU Morse (the same check as the Kiro hook)
      - run: node .kiro/powers/morse-validator/skills/validate-morse/scripts/validate-morse.mjs --strict
      # the agent route loads and its exports are intact (no key needed)
      - run: node -e "import('./server/agent-route.mjs').then((m) => { if (typeof m.default !== 'function' || typeof m.buildMessages !== 'function') process.exit(1) })"
